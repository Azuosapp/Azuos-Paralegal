name: Testar Acesso Real

# Dois testes complementares:
#  1) Le do Google o ruleset REALMENTE publicado e confere a lista de autorizados.
#  2) SIMULA a pessoa usando o sistema: autentica como ela (custom token do Admin
#     SDK, sem precisar da senha), grava um documento pelas MESMAS regras que o
#     app usa, le de volta e apaga. E o teste que responde "ela consegue salvar?".
#
# Escreve em azuos/_teste_permissao_<pessoa> — coberto pela mesma regra de
# match /azuos/{doc=**}, mas sem encostar em nenhum dado real.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar credencial
        env:
          SA_A: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZUOS_PARALEGAL }}
          SA_B: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_C: ${{ secrets.FIREBASE_SERVICE_ACC0UNT }}
        run: |
          V="$SA_A"; [ -z "$V" ] && V="$SA_B"; [ -z "$V" ] && V="$SA_C"
          [ -z "$V" ] && { echo "ERRO: sem credencial."; exit 1; }
          printf '%s' "$V" > "$HOME/sa.json"
          node -e "console.log('Conta:', JSON.parse(require('fs').readFileSync(process.env.HOME+'/sa.json','utf8')).client_email)"

      - name: Autenticar no gcloud
        run: |
          gcloud auth activate-service-account --key-file="$HOME/sa.json" --quiet
          echo "TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - name: 1) Regras publicadas neste momento
        run: |
          set -e
          REL=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://firebaserules.googleapis.com/v1/projects/azuos-paralegal/releases/cloud.firestore")
          RS=$(echo "$REL" | python3 -c "import json,sys; print(json.load(sys.stdin)['rulesetName'])")
          echo "$REL" | python3 -c "import json,sys; d=json.load(sys.stdin); print('ruleset publicado:', d['rulesetName']); print('criado em       :', d.get('createTime'))"
          curl -s -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/$RS" > /tmp/live.json
          python3 - <<'PY'
          import json, re
          d = json.load(open('/tmp/live.json'))
          src = ''.join(f['content'] for f in d['source']['files'])
          open('/tmp/live.rules','w').write(src)
          em = re.findall(r"'([^']+@[^']+)'", src)
          print('autorizados no ar:', len(em))
          for alvo in ['yara@azuoscontabil.com.br','gabryel@azuoscontabil.com.br',
                       'azuos@azuoscontabil.com.br','leylaazuos@gmail.com',
                       'leyla@azuoscontabil.com.br']:
              print(('  OK    ' if alvo in em else '  FALTA '), alvo)
          PY

      - name: Instalar firebase-admin (em pasta isolada)
        # Fora do repositorio de proposito: instalar na raiz mexeria no
        # package.json do projeto, e rodar o script de /tmp com node_modules no
        # workspace da ERR_MODULE_NOT_FOUND.
        run: |
          mkdir -p /tmp/sim
          cd /tmp/sim
          npm init -y >/dev/null 2>&1
          npm i firebase-admin@12 --no-audit --no-fund --loglevel=error

      - name: 2) Simular a pessoa digitando e salvando
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/sa.json
          WEB_API_KEY: AIzaSyAetNviUEud17HVdmUyfY_FaMVaK4WwWA8
        run: |
          cat > /tmp/sim/sim.mjs <<'JS'
          import admin from 'firebase-admin';
          admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: 'azuos-paralegal' });

          const KEY = process.env.WEB_API_KEY;
          const PROJ = 'azuos-paralegal';
          // Quem REALMENTE tem conta. Sem isto, "sem conta" pode significar tanto
          // "a pessoa nao foi cadastrada" quanto "ela entra com outro endereco".
          const todos = [];
          let page;
          do {
            const r = await admin.auth().listUsers(1000, page);
            r.users.forEach(u => todos.push(u));
            page = r.pageToken;
          } while (page);
          console.log(`CONTAS EXISTENTES NO FIREBASE AUTHENTICATION (${todos.length}):`);
          todos
            .sort((a,b) => (a.email||'').localeCompare(b.email||''))
            .forEach(u => {
              const ult = u.metadata?.lastSignInTime ? new Date(u.metadata.lastSignInTime).toISOString().slice(0,10) : 'nunca';
              const nome = (u.displayName || '(sem nome)').padEnd(22);
              console.log(`   ${(u.email||'(sem e-mail)').padEnd(38)} ${nome} ultimo acesso: ${ult}${u.disabled ? '  [DESATIVADA]' : ''}`);
            });
          console.log('');

          // [04/08/2026] Testa TODA conta que existe, em vez de uma lista escrita a mao.
          // A lista a mao era copia da lista de autorizados, entao ela so conseguia
          // confirmar que quem estava autorizado estava autorizado. As contas de fora —
          // exatamente as que nao conseguem gravar — nunca eram testadas. Foi assim que
          // Yara, Gabryel e Humberto passaram semanas logando e com toda gravacao
          // recusada, com este diagnostico dizendo "todos conseguem gravar".
          const alvos = todos
            .filter(u => u.email && !u.disabled)
            .map(u => u.email.toLowerCase())
            .sort();

          let falhas = 0, semConta = [];

          for (const email of alvos) {
            const rot = email.padEnd(32);
            let user;
            try {
              user = await admin.auth().getUserByEmail(email);
            } catch (e) {
              console.log(`  SEM CONTA  ${rot} -> nao existe no Firebase Authentication`);
              semConta.push(email);
              continue;
            }

            // 1) vira "a pessoa" sem precisar da senha
            const custom = await admin.auth().createCustomToken(user.uid);
            const r1 = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${KEY}`, {
              method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ token: custom, returnSecureToken: true })
            });
            const j1 = await r1.json();
            if (!j1.idToken) {
              console.log(`  FALHA      ${rot} -> nao consegui autenticar: ${JSON.stringify(j1.error?.message||j1)}`);
              falhas++; continue;
            }

            // 2) grava, como o app grava (mesma colecao, mesmas regras)
            const doc = `_teste_permissao_${email.replace(/[^a-z0-9]/gi,'_')}`;
            const url = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/azuos/${doc}`;
            const corpo = { fields: { origem: { stringValue: 'teste automatico' }, quando: { stringValue: new Date().toISOString() } } };
            const r2 = await fetch(url, {
              method: 'PATCH', headers: { 'Authorization': `Bearer ${j1.idToken}`, 'Content-Type':'application/json' },
              body: JSON.stringify(corpo)
            });
            if (!r2.ok) {
              const err = await r2.text();
              console.log(`  BLOQUEADO  ${rot} -> HTTP ${r2.status} ${err.slice(0,120)}`);
              falhas++; continue;
            }

            // 3) le de volta
            const r3 = await fetch(url, { headers: { 'Authorization': `Bearer ${j1.idToken}` } });
            const leu = r3.ok;

            // 4) limpa
            await fetch(url, { method: 'DELETE', headers: { 'Authorization': `Bearer ${j1.idToken}` } });

            console.log(`  OK         ${rot} -> gravou${leu ? ' e leu' : ' (leitura falhou)'} com sucesso`);
            if (!leu) falhas++;
          }

          // ---- Quem e quem: cruza o CADASTRO do app com as CONTAS de login ----
          // O app tem lista propria de usuarios (vem da planilha). Aparecer ali NAO
          // significa ter login no Firebase. E o que costuma gerar o mal-entendido
          // de "essa pessoa tem conta sim".
          const db = admin.firestore();
          const snap = await db.collection('azuos').doc('shared').get();
          const dados = snap.exists ? snap.data() : {};
          const cadastro = dados.usuarios || [];
          console.log('CADASTRO DE USUARIOS DENTRO DO APP (' + cadastro.length + '):');
          const emailsAuth = new Set(todos.map(u => (u.email||'').toLowerCase()));
          cadastro.forEach(u => {
            const em = String(u.email||'').toLowerCase();
            const temLogin = emailsAuth.has(em);
            console.log('   ' + String(u.nome||'(sem nome)').padEnd(16)
              + String(u.email||'(sem e-mail)').padEnd(38)
              + (temLogin ? 'TEM LOGIN' : 'SEM LOGIN no Firebase'));
          });
          console.log('');
          const chaves = Object.keys(dados.ciencias_por_usuario || {});
          console.log('QUEM JA REGISTROU CIENCIA (chaves gravadas):');
          chaves.forEach(k => console.log('   ' + k + '  -> ' + ((dados.ciencias_por_usuario[k]||[]).length) + ' registros'));
          console.log('');

          // ---- Quem e quem: identifica conta pelo que ela EDITOU ----
          // Contas sem displayName nao dizem de quem sao. Mas cada edicao de alvara
          // guarda _editado_por, e cada alvara pertence a uma empresa que tem
          // responsavel. Cruzando os tres, o dono da conta aparece.
          try {
            const alvMeta = await db.collection('azuos').doc('alvaras_meta').get();
            let alvs = [];
            if (alvMeta.exists) {
              const n = (alvMeta.data() || {}).n || 0;
              let json = '';
              for (let i = 0; i < n; i++) {
                const c = await db.collection('azuos').doc('alvaras_' + i).get();
                json += ((c.data() || {}).d) || '';
              }
              if (json) { try { alvs = JSON.parse(json); } catch (e) { alvs = []; } }
            }
            console.log('alvaras na nuvem:', alvs.length);

            const porId = {};
            alvs.forEach(a => { if (a && a.id != null) porId[String(a.id)] = a; });

            const eds = dados.edicoes_alvaras || {};
            const perfil = {};   // email -> { total, empresas:Set, responsaveis:{} }
            Object.keys(eds).forEach(aid => {
              const e = eds[aid];
              const quem = e && e._editado_por;
              if (!quem) return;
              const k = String(quem).toLowerCase();
              perfil[k] = perfil[k] || { total: 0, resp: {} };
              perfil[k].total++;
              const a = porId[String(aid)];
              const r = a && (a.responsavel || '');
              if (r) perfil[k].resp[r] = (perfil[k].resp[r] || 0) + 1;
            });

            console.log('');
            console.log('QUEM EDITOU O QUE (identifica conta sem nome):');
            Object.keys(perfil).sort((a, b) => perfil[b].total - perfil[a].total).forEach(k => {
              const p = perfil[k];
              const top = Object.keys(p.resp).sort((a, b) => p.resp[b] - p.resp[a]).slice(0, 4)
                .map(r => r + ' (' + p.resp[r] + ')').join(', ');
              console.log('   ' + k.padEnd(36) + p.total + ' edicoes  -> empresas de: ' + (top || '(sem responsavel identificado)'));
            });
          } catch (e) {
            console.log('nao consegui cruzar edicoes:', (e && e.message) || e);
          }
          console.log('');

          // ---- Procura rastro de uma pessoa em TODO o documento compartilhado ----
          // Se a Yara usa o sistema, tem de haver marca dela em algum lugar:
          // ciencia, historico, chamado de manutencao, edicao. Se nao houver
          // NENHUMA, ela nunca usou — e ai o cadastro dela e so um nome na lista.
          try {
            const ALVOS = ['yara', 'gabryel'];
            ALVOS.forEach(alvo => {
              console.log('');
              console.log('RASTRO DE "' + alvo.toUpperCase() + '" NO BANCO:');
              let achou = 0;

              const cs = dados.ciencias_por_usuario || {};
              Object.keys(cs).forEach(k => {
                if (String(k).toLowerCase().indexOf(alvo) >= 0) {
                  console.log('   ciencias sob a chave "' + k + '": ' + (cs[k] || []).length);
                  achou++;
                }
              });

              const hist = dados.historico || [];
              const h = hist.filter(x => JSON.stringify(x || {}).toLowerCase().indexOf(alvo) >= 0);
              if (h.length) {
                console.log('   historico: ' + h.length + ' evento(s). Mais recentes:');
                h.slice(0, 3).forEach(x => console.log('      ' + (x.data || '') + ' | ' + (x.usuario || x.quem || '?') + ' | ' + (x.acao || x.evento || '')));
                achou++;
              }

              const mnt = dados.manutencao || [];
              const m = mnt.filter(x => String((x && (x.autor_email || x.autor_nome)) || '').toLowerCase().indexOf(alvo) >= 0);
              if (m.length) { console.log('   chamados de manutencao abertos: ' + m.length); achou++; }

              const eds = dados.edicoes_alvaras || {};
              const ed = Object.keys(eds).filter(k => String((eds[k] || {})._editado_por || '').toLowerCase().indexOf(alvo) >= 0);
              if (ed.length) { console.log('   alvaras editados: ' + ed.length); achou++; }

              const us = (dados.usuarios || []).filter(u => JSON.stringify(u || {}).toLowerCase().indexOf(alvo) >= 0);
              us.forEach(u => console.log('   cadastro: nome="' + (u.nome || '') + '" email="' + (u.email || '') + '" ativo=' + u.ativo));

              if (!achou) console.log('   >>> NENHUM rastro de uso. So existe o cadastro (nome na lista).');
            });
          } catch (e) {
            console.log('nao consegui procurar rastro:', (e && e.message) || e);
          }
          console.log('');

          // ---- Diagnostico da PREMIACAO ----
          // Responde: os alvaras com anexo estao CONTANDO, ou algo os exclui?
          try {
            const GAM = ['Concluído','Pago','Formalizado','Formalizado com o cliente','Em vigor (vencimento)'];
            const cfg = dados.gamificacao || {};
            const statusOk = (Array.isArray(cfg.statusConcluido) && cfg.statusConcluido.length) ? cfg.statusConcluido : GAM;
            const eds = dados.edicoes_alvaras || {};
            const mes = (process.env.MES_ALVO || '').trim() || new Date().toISOString().slice(0,7);
            console.log('PREMIACAO — mes ' + mes);
            console.log('status que pagam:', statusOk.join(', '));

            let noMes = 0, semStatus = 0, comAnexo = 0, semAnexo = 0, validados = 0;
            const porPessoa = {};
            Object.keys(eds).forEach(aid => {
              const e = eds[aid] || {};
              if (!e._editado_por || !e._editado_em) return;
              if (String(e._editado_em).slice(0,7) !== mes) return;
              noMes++;
              if (statusOk.indexOf(e.status) < 0) { semStatus++; return; }
              const anx = Array.isArray(e.anexos) ? e.anexos : [];
              const quem = String(e._editado_por).toLowerCase();
              porPessoa[quem] = porPessoa[quem] || { conta: 0, semAnexo: 0, validado: 0 };
              if (anx.length) {
                comAnexo++; porPessoa[quem].conta++;
                if (anx.some(a => a && a._validacao && a._validacao.ok && a._validacao.mes === mes)) {
                  validados++; porPessoa[quem].validado++;
                }
              } else { semAnexo++; porPessoa[quem].semAnexo++; }
            });

            console.log('');
            console.log('  editados no mes .................. ' + noMes);
            console.log('  fora dos status que pagam ....... ' + semStatus);
            console.log('  COM anexo (CONTAM na premiacao) . ' + comAnexo);
            console.log('  sem anexo (nao contam) .......... ' + semAnexo);
            console.log('  dos que contam, validados pela IA  ' + validados + '  -> os outros ' + (comAnexo - validados) + ' aparecem como "pendente", mas JA CONTAM');
            console.log('');
            console.log('  por pessoa:');
            Object.keys(porPessoa).sort((a,b) => porPessoa[b].conta - porPessoa[a].conta).forEach(k => {
              const p = porPessoa[k];
              console.log('    ' + k.padEnd(34) + 'contam: ' + String(p.conta).padStart(3)
                + ' | validados: ' + String(p.validado).padStart(3)
                + ' | sem anexo: ' + String(p.semAnexo).padStart(3));
            });
          } catch (e) {
            console.log('nao consegui diagnosticar a premiacao:', (e && e.message) || e);
          }
          console.log('');

          // ---- Chamados de Manutencao que chegaram ao banco ----
          try {
            const mnt = dados.manutencao || [];
            console.log('CHAMADOS DE MANUTENCAO no banco: ' + mnt.length);
            mnt.slice().sort((a,b) => String((b&&b.created_at)||'').localeCompare(String((a&&a.created_at)||'')))
              .slice(0, 20).forEach(t => {
                console.log('   [' + String((t&&t.created_at)||'?').slice(0,16) + '] '
                  + String((t&&t.tipo)||'?').padEnd(9)
                  + String((t&&t.status)||'?').padEnd(12)
                  + ' por ' + String((t&&(t.autor_nome||t.autor_email))||'?').padEnd(22)
                  + ' | ' + String((t&&t.titulo)||'(sem titulo)').slice(0,50)
                  + (t&&t.arquivado ? '  [ARQUIVADO]' : ''));
              });
            if (!mnt.length) {
              console.log('   >>> NENHUM chamado chegou ao banco.');
              console.log('   Se alguem preencheu e enviou, o chamado ficou so no navegador da pessoa');
              console.log('   (falha de permissao, ou o texto foi apagado por re-render antes do envio).');
            }
          } catch (e) {
            console.log('nao consegui ler manutencao:', (e && e.message) || e);
          }
          console.log('');

          // ---- Tamanho do documento azuos/shared (limite de 1MB do Firestore) ----
          // O teste de permissao grava num doc pequeno e separado, entao NAO pegaria
          // uma falha por tamanho. Se 'shared' estourar 1MB, TODA gravacao falha para
          // todo mundo — e os chamados de manutencao vivem nele.
          try {
            const bruto = JSON.stringify(dados);
            const kb = Math.round(bruto.length / 1024);
            console.log('DOCUMENTO azuos/shared: ' + kb + ' KB de 1024 KB' + (kb > 900 ? '  <<< PERTO DO LIMITE' : ''));
            const campos = Object.keys(dados).map(k => ({
              k: k, kb: Math.round(JSON.stringify(dados[k] === undefined ? null : dados[k]).length / 1024)
            })).sort((a, b) => b.kb - a.kb);
            console.log('   maiores campos:');
            campos.slice(0, 8).forEach(c => console.log('     ' + c.k.padEnd(26) + String(c.kb).padStart(5) + ' KB'));
            if (kb > 1024) console.log('   >>> ESTOUROU: nenhuma gravacao neste documento funciona.');
            else if (kb > 900) console.log('   >>> RISCO: perto do limite; qualquer acrescimo pode derrubar as gravacoes.');
          } catch (e) {
            console.log('nao consegui medir o documento:', (e && e.message) || e);
          }
          console.log('');

          // ---- ANEXOS: estao mesmo chegando na nuvem? ----
          // [04/08/2026] Relato "nao esta permitindo salvar arquivos". O anexo vai para
          // azuos/anx_<id> (mais anx_<id>__N quando fatiado). Se a gravacao estivesse
          // falhando, nao apareceria doc novo aqui. Sem esta medicao, "o anexo nao salva"
          // fica sendo palavra contra palavra.
          try {
            const snap = await admin.firestore().collection('azuos').get();
            const anx = [], chunks = [];
            let maior = 0, maiorId = '';
            snap.forEach(d => {
              if (!d.id.startsWith('anx_')) return;
              const v = d.data() || {};
              const bytes = Buffer.byteLength(JSON.stringify(v), 'utf8');
              if (bytes > maior) { maior = bytes; maiorId = d.id; }
              if (d.id.includes('__')) chunks.push(d.id);
              else anx.push({ id: d.id, ts: v.ts || 0, nome: v.nome || '', n: v.n || 1, bytes });
            });
            anx.sort((a, b) => b.ts - a.ts);
            console.log('ANEXOS NA NUVEM: ' + anx.length + ' arquivos (' + chunks.length + ' pedacos extras)');
            console.log('   maior documento: ' + Math.round(maior / 1024) + ' KB de 1024 KB' + (maior > 1000000 ? '  <<< NO LIMITE' : '') + (maiorId ? '  (' + maiorId + ')' : ''));
            console.log('   os 10 mais recentes:');
            anx.slice(0, 10).forEach(a => {
              const q = a.ts ? new Date(a.ts).toISOString().slice(0, 16).replace('T', ' ') : 'sem data';
              console.log('     ' + q + '  ' + String(Math.round(a.bytes / 1024)).padStart(4) + ' KB  ' + (a.nome || a.id).slice(0, 50));
            });
            if (!anx.length) console.log('   >>> NENHUM anexo na nuvem: a gravacao de arquivo nao esta funcionando.');
          } catch (e) {
            console.log('nao consegui medir os anexos:', (e && e.message) || e);
          }
          console.log('');

          // ---- EDICOES: agora moram em chunks, nao no shared ----
          // [04/08/2026] Esta secao lia dados.edicoes_alvaras, campo que saiu do shared
          // na v7.2.0 — entao vinha reportando ZERO edicoes desde entao, escondendo
          // exatamente o dado que precisavamos olhar.
          try {
            const meta = await admin.firestore().doc('azuos/edicoes_meta').get();
            if (!meta.exists) {
              console.log('EDICOES: azuos/edicoes_meta nao existe — nada foi salvo pelos chunks ainda.');
            } else {
              const m = meta.data() || {};
              const q = m.ver ? new Date(m.ver).toISOString().slice(0, 16).replace('T', ' ') : 'sem data';
              console.log('EDICOES (chunks): ' + (m.count || 0) + ' alvaras editados, ' + (m.n || 0) + ' pedaco(s), ultima gravacao ' + q);
            }
          } catch (e) {
            console.log('nao consegui ler edicoes_meta:', (e && e.message) || e);
          }
          console.log('');

          // ---- Legado: o que ainda restou de edicoes dentro do shared ----
          try {
            const eds = dados.edicoes_alvaras || {};
            const ids = Object.keys(eds);
            const porCampo = {};
            let comAnexo = 0, comConversa = 0;
            ids.forEach(id => {
              const e = eds[id] || {};
              Object.keys(e).forEach(c => {
                const kb = JSON.stringify(e[c] === undefined ? null : e[c]).length;
                porCampo[c] = (porCampo[c] || 0) + kb;
              });
              if (Array.isArray(e.anexos) && e.anexos.length) comAnexo++;
              if (Array.isArray(e.conversas) && e.conversas.length) comConversa++;
            });
            console.log('EDICOES_ALVARAS: ' + ids.length + ' alvaras editados');
            console.log('   com anexo: ' + comAnexo + ' | com conversa: ' + comConversa);
            console.log('   peso por campo:');
            Object.keys(porCampo).sort((a,b) => porCampo[b] - porCampo[a]).slice(0, 12).forEach(c => {
              console.log('     ' + c.padEnd(24) + String(Math.round(porCampo[c]/1024)).padStart(5) + ' KB');
            });
            const amostra = eds[ids[0]];
            if (amostra) console.log('   exemplo de registro: ' + JSON.stringify(amostra).slice(0, 300));
          } catch (e) {
            console.log('nao consegui medir edicoes_alvaras:', (e && e.message) || e);
          }
          console.log('');

          console.log('');
          if (semConta.length) {
